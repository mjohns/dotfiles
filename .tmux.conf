unbind %
bind | split-window -h
bind - split-window -v
set -g terminal-overrides 'xterm*:smcup@:rmcup@'
set-option -g prefix C-j
bind-key C-j last-window
bind-key C-k select-pane -t :.+
bind-key C-h resize-pane -Z
bind-key C-n next-window
bind-key C-p previous-window
bind-key C-d resize-pane -R 5
bind-key C-a resize-pane -L 5
bind-key C-w resize-pane -U 5
bind-key C-s resize-pane -D 5
unbind r
bind r source-file ~/.tmux.conf

set -sg escape-time 0

set-window-option -g mode-keys vi
bind-key C-u copy-mode
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -i -sel c"
unbind p
bind p paste-buffer

bind C-l send-keys 'C-l'

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:Tc"

set -s set-clipboard on
set -g allow-passthrough on

# Disable the bottom status bar
set -g status off

set -g pane-active-border-style 'fg=#268bd2,bg=default'

# Make active pane more recognizable
# set -g window-style 'fg=default,bg=#fcf3da'
set -g window-style 'fg=default,bg=#F7F1DF' #subtle
set -g window-style 'fg=default,bg=#eee8d5' #darker
set -g window-active-style 'fg=default,bg=#fdf6e3'

